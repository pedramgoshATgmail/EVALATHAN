<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EVALATHAN</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/favicon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=gold49" />
  <link rel="preload" as="image" href="assets/evalathan-dragon.webp?v=5" type="image/webp" />
  <link rel="preload" as="image" href="assets/hydra-logo.webp?v=5" type="image/webp" />
  <link rel="preload" as="image" href="assets/dehydrus-logo.webp?v=5" type="image/webp" />
  <link rel="preload" as="image" href="assets/benchrex-logo.webp?v=5" type="image/webp" />
  <script>
    (function () {
      var t = localStorage.getItem("evalathan_theme");
      if (t !== "black" && t !== "white" && t !== "grey") t = "black";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div id="app-screen" class="app-screen">
    <!-- LEFT SLIDER - closed on splash; opens on evals -->
    <aside class="slideout" id="slideout" aria-hidden="true">
      <div class="slideout-inner">
        <div class="rail-scroll" id="slideout-scroll">
          <button type="button" class="home-btn" id="btn-home" title="HOME - Evalathan splash">
            <span class="corner-label">home</span>
          </button>
          <nav class="engine-stack" id="engine-stack" aria-label="Router engines"></nav>
          <div class="mascots">
            <button type="button" class="mascot-wrap is-soon" title="Coming soon" aria-label="PRICKLY - Coming soon">
              <img class="mascot" src="assets/prickly.png" alt="PRICKLY" draggable="false" />
              <span class="mascot-soon-blurb" hidden>Coming soon</span>
            </button>
            <button type="button" class="mascot-wrap is-soon" title="Coming soon" aria-label="FUSS - Coming soon">
              <img class="mascot" src="assets/fuss.png" alt="FUSS" draggable="false" />
              <span class="mascot-soon-blurb" hidden>Coming soon</span>
            </button>
          </div>
          <div class="slide-section">
            <button type="button" class="section-label" id="btn-gloss" title="Open Evalathan glossary">GLOSS</button>
          </div>
          <div class="slide-section">
            <button type="button" class="section-label" id="btn-selfbelt" title="Open SELFBELT glossary entry">SELFBELT</button>
          </div>
        </div>
        <div class="theme-toggle" role="group" aria-label="Color theme">
          <button type="button" class="theme-btn" data-theme-set="white" title="White">☀</button>
          <button type="button" class="theme-btn" data-theme-set="grey" title="Grey">◐</button>
          <button type="button" class="theme-btn" data-theme-set="black" title="Black">☾</button>
        </div>
      </div>
    </aside>

    <main class="center" id="center">
      <header class="center-head">
        <div class="head-left">
          <button type="button" class="corner-toggle engines-corner" id="btn-toggle-engines" aria-expanded="false" title="evals - open engine rail">
            <span class="corner-label">evals</span>
          </button>
        </div>
        <div class="head-right">
          <button type="button" class="corner-toggle runs-corner" id="btn-toggle-runs" aria-expanded="false" title="history - open latest run and saved runs">
            <span class="corner-label">history</span>
          </button>
        </div>
      </header>

      <div class="page-stage is-splash" id="page-stage">
        <div class="splash-brand" id="splash-brand">
          <p class="plg-tag" id="plg-tag">
            <a href="https://github.com/pedramgoshATgmail/EVALATHAN/blob/main/GLOSSARY.md#user-content-product-led-growth" target="_blank" rel="noopener noreferrer" title="Product-led growth (PLG) - glossary">Making your PLG more efficient, robust, and user-friendly!</a>
          </p>
          <div class="splash-art-slot art-evalathan">
            <img class="splash-art" id="splash-art" src="assets/evalathan-dragon.webp?v=5" alt="EVALATHAN" decoding="async" fetchpriority="high" />
          </div>
          <h1 class="splash-title" id="splash-title">EVALATHAN</h1>
          <hr class="splash-rule" />
          <p class="blurbs" id="blurbs"></p>
        </div>
        <div class="splash-mid">
          <section class="slotbox" aria-label="Evaluate target">
            <div class="slot-pill">
              <input id="target-input" type="text" spellcheck="false" autocomplete="off" placeholder="Upload your GitHub link or folder…" />
              <input id="folder-picker" type="file" webkitdirectory directory multiple hidden />
              <button type="button" id="btn-browse" title="Browse a folder on this PC">Browse</button>
              <button type="button" id="btn-eval" class="primary" title="Evaluate">Evaluate</button>
            </div>
          </section>
        </div>
        <div class="splash-foot" id="splash-foot">
          <hr class="splash-rule splash-rule-foot" />
          <a class="repo-link" id="repo-link" href="https://github.com/pedramgoshATgmail/EVALATHAN" target="_blank" rel="noopener noreferrer" title="Evalathan GitHub">Evalathan GitHub</a>
        </div>
        <section class="results" id="results" aria-live="polite"></section>
      </div>
    </main>

    <!-- RIGHT SLIDER - closed on splash; opens on history -->
    <aside class="runs-rail" id="runs-rail" aria-hidden="true">
      <div class="runs-inner">
        <div class="rail-scroll" id="rail-scroll"></div>
      </div>
    </aside>
  </div>

  <!-- Multi-memo stack: each saved/eval run can open its own window -->
  <div id="memo-layer" class="memo-layer" hidden></div>

  <script src="app.js?v=gold49"></script>
</body>
</html>
